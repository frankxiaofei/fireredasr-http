# Include within nginx's http {} context. Add TLS before public exposure.
limit_req_zone $binary_remote_addr zone=asr_rate:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=asr_conn:10m;
server {
    listen 8080;
    client_max_body_size 21m;
    client_body_timeout 60s;
    client_header_timeout 10s;
    keepalive_timeout 10s;
    limit_conn asr_conn 8;
    limit_req zone=asr_rate burst=10 nodelay;
    limit_req_status 429;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 40s;
        proxy_send_timeout 60s;
    }
}
